<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | Shnoda Sameh</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a1f;--surface:#14143a;--ink:#eef0ff;--acc:#22d3ee;--acc2:#c084fc;--muted:#9aa0c8;--line:rgba(160,170,255,.18);--bad:#ff6b8a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.ltr{direction:ltr;text-align:left}
.field{width:100%;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
.field:focus{border-color:var(--acc);outline:none}
.btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--acc);transform:translateY(-2px)}
.btn.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#06061a;border-color:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:20px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.login h1{font-family:'Space Grotesk',sans-serif;font-size:26px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{color:var(--muted);margin:4px 0 20px;font-size:14px}
.login .btn{width:100%;justify-content:center;margin-top:14px}

/* app */
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:rgba(10,10,31,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:'Space Grotesk',sans-serif;font-size:22px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-family:'Cairo',sans-serif;font-size:14px;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-inline-start:10px}
.top-actions,.bar{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:980px;margin:0 auto;padding:26px 20px 90px}
.note{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.25);border-radius:16px;padding:12px 16px;font-size:14px;margin-bottom:18px}
.bar{margin-bottom:16px;align-items:center}
.bar .field{width:auto;flex:1;min-width:180px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.thumb{width:84px;height:56px;border-radius:10px;object-fit:cover;object-position:top;background:var(--c,#0891b2)}
.row h3{font-family:'Space Grotesk','Cairo',sans-serif;font-size:17px}
.row p{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chips i{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted)}
.acts{display:flex;gap:6px}
.acts button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-size:15px;transition:border-color .2s}
.acts button:hover:not(:disabled){border-color:var(--acc)}
.acts button:disabled{opacity:.3;cursor:default}
.acts .del:hover{border-color:var(--bad);color:var(--bad)}
.none{text-align:center;color:var(--muted);padding:60px 0}

/* dialog */
dialog{margin:auto;width:min(560px,calc(100% - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:0;box-shadow:0 40px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,5,20,.75);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
dialog h2{font-size:20px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgbox{display:flex;gap:14px;align-items:center}
.preview{width:120px;height:80px;border-radius:12px;border:1px dashed var(--line);object-fit:cover;object-position:top;background:var(--c,#0891b2);flex:none}
.imgbox .col{flex:1;display:flex;flex-direction:column;gap:8px}
input[type=color]{width:100%;height:44px;padding:4px;cursor:pointer}
.foot{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#0a0a1f;padding:11px 22px;border-radius:999px;font-weight:600;z-index:50;transition:transform .3s ease;max-width:calc(100% - 24px);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (max-width:640px){.row{grid-template-columns:64px 1fr}.thumb{width:64px;height:48px}.acts{grid-column:1/-1;justify-content:flex-end}.two{grid-template-columns:1fr}.top{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <h1>SHNO Admin</h1>
    <p>اكتب كلمة السر عشان تدخل لوحة التحكم</p>
    <input class="field ltr" type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password" aria-label="كلمة السر" autofocus>
    <button class="btn primary" type="submit">دخول</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">SHNO<small>لوحة التحكم</small></div>
    <div class="top-actions">
      <a class="btn" href="index.html" target="_blank">عرض البورتفوليو</a>
      <button class="btn" id="changePw">تغيير كلمة السر</button>
      <button class="btn" id="logout">خروج</button>
    </div>
  </header>

  <main class="wrap">
    <div class="note">التعديلات بتتحفظ في المتصفح ده وتظهر في البورتفوليو عندك فوراً. عشان تظهر لكل الزوار: دوس <b>نشر</b>، هينزل ملف <span class="ltr">projects.js</span>، حطه مكان القديم في فولدر الموقع وارفعه على Vercel أو GitHub.</div>

    <div class="bar">
      <button class="btn primary" id="add">+ إضافة مشروع</button>
      <button class="btn" id="publish">نشر (تحميل projects.js)</button>
      <button class="btn" id="backup">نسخة احتياطية</button>
      <label class="btn" style="flex-direction:row;color:var(--ink);font-size:14px">استيراد<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      <button class="btn danger" id="reset">رجوع للمنشور</button>
    </div>

    <div class="list" id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">إضافة مشروع</h2>
    <label>اسم المشروع
      <input class="field ltr" id="fTitle" maxlength="40" required placeholder="Barber Shop">
    </label>
    <label>وصف قصير
      <textarea class="field ltr" id="fDesc" rows="2" maxlength="160" placeholder="A clean, modern website for a barber shop."></textarea>
    </label>
    <label>التقنيات (افصل بينهم بفاصلة)
      <input class="field ltr" id="fTags" placeholder="HTML, CSS, JavaScript">
    </label>
    <div class="two">
      <label>رابط الموقع (Live Demo)
        <input class="field ltr" id="fDemo" type="url" placeholder="https://...">
      </label>
      <label>رابط الكود (اختياري)
        <input class="field ltr" id="fRepo" type="url" placeholder="https://github.com/...">
      </label>
    </div>
    <div class="imgbox">
      <img class="preview" id="prev" alt="معاينة الصورة">
      <div class="col">
        <label class="btn" style="flex-direction:row;justify-content:center;color:var(--ink)">ارفع صورة<input type="file" id="fFile" accept="image/*" hidden></label>
        <label>أو اسم صورة موجودة جنب الموقع
          <input class="field ltr" id="fImg" placeholder="barber.jpg">
        </label>
      </div>
    </div>
    <label>لون الكارت (لو مفيش صورة)
      <input class="field" id="fColor" type="color" value="#0891b2">
    </label>
    <p class="err" id="formErr" role="alert"></p>
    <div class="foot">
      <button type="button" class="btn" id="cancel">إلغاء</button>
      <button type="submit" class="btn primary">حفظ</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="projects.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var KEY="shno-projects",PKEY="shno-admin-pass",SKEY="shno-admin-session";
  var published=Array.isArray(window.SHNO_PROJECTS)?window.SHNO_PROJECTS:[];
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var src=function(v){v=String(v||"").trim();if(!v)return"";return /^(data:image\/|https?:\/\/|\.?\/)/i.test(v)?v:"./"+encodeURI(v)};
  var okUrl=function(u){return !u||/^https?:\/\//i.test(u)};
  var color=function(c){return /^#[0-9a-f]{6}$/i.test(c||"")?c:"#0891b2"};

  var list=load(),editing=null,imgValue="";

  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s}catch(e){}
    return clone(published);
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(list))}
    catch(e){toast("المساحة اتملت. استخدم صور أصغر أو اكتب اسم ملف الصورة.");return false}
    render();return true;
  }
  var tt;
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2800)}

  /* login (client-side only: it hides the panel, it is not real security) */
  var getPass=function(){return localStorage.getItem(PKEY)||"shnoda2026"};
  function enter(){$("#login").hidden=true;$("#app").hidden=false;render()}
  if(sessionStorage.getItem(SKEY)==="1")enter();
  $("#loginForm").addEventListener("submit",function(e){
    e.preventDefault();
    if($("#pw").value===getPass()){sessionStorage.setItem(SKEY,"1");enter()}
    else{$("#loginErr").textContent="كلمة السر غلط. جرب تاني.";$("#pw").select()}
  });
  $("#logout").onclick=function(){sessionStorage.removeItem(SKEY);location.reload()};
  $("#changePw").onclick=function(){
    var p=prompt("اكتب كلمة السر الجديدة (4 حروف على الأقل):");
    if(p===null)return;
    if(p.length<4)return toast("كلمة السر قصيرة");
    localStorage.setItem(PKEY,p);toast("اتغيرت كلمة السر");
  };

  /* list */
  function render(){
    $("#list").innerHTML=list.length?list.map(function(p,i){
      var img=src(p.img);
      return '<div class="row" style="--c:'+color(p.color)+'">'+
        (img?'<img class="thumb" src="'+esc(img)+'" alt="'+esc(p.title)+'">':'<div class="thumb"></div>')+
        '<div><h3 class="ltr">'+esc(p.title)+'</h3><p class="ltr">'+esc(p.desc||"")+'</p>'+
        '<div class="chips ltr">'+(p.tags||[]).map(function(t){return"<i>"+esc(t)+"</i>"}).join("")+'</div></div>'+
        '<div class="acts">'+
          '<button data-up="'+i+'" aria-label="فوق"'+(i===0?" disabled":"")+'>↑</button>'+
          '<button data-down="'+i+'" aria-label="تحت"'+(i===list.length-1?" disabled":"")+'>↓</button>'+
          '<button data-edit="'+i+'" aria-label="تعديل">✎</button>'+
          '<button class="del" data-del="'+i+'" aria-label="حذف">✕</button>'+
        '</div></div>';
    }).join(""):'<p class="none">مفيش مشاريع لسه. دوس "إضافة مشروع".</p>';
  }
  $("#list").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var d=b.dataset,i;
    if(d.edit!==undefined)openForm(+d.edit);
    if(d.del!==undefined){
      i=+d.del;
      if(confirm('تمسح "'+list[i].title+'"؟')){list.splice(i,1);if(save())toast("اتمسح المشروع")}
    }
    if(d.up!==undefined||d.down!==undefined){
      i=+(d.up!==undefined?d.up:d.down);var j=d.up!==undefined?i-1:i+1;
      if(j<0||j>=list.length)return;
      var t=list[i];list[i]=list[j];list[j]=t;save();
    }
  });

  /* form */
  var dlg=$("#dlg");
  function setPreview(v){
    imgValue=v;var p=$("#prev");
    if(v)p.src=src(v);else p.removeAttribute("src");
  }
  function openForm(i){
    editing=(i===undefined)?null:i;
    var p=editing===null?null:list[editing];
    $("#dlgTitle").textContent=p?"تعديل مشروع":"إضافة مشروع";
    $("#fTitle").value=p?p.title:"";
    $("#fDesc").value=p?p.desc||"":"";
    $("#fTags").value=p?(p.tags||[]).join(", "):"";
    $("#fDemo").value=p?p.demo||"":"";
    $("#fRepo").value=p?p.repo||"":"";
    $("#fColor").value=color(p&&p.color);
    $("#fFile").value="";
    $("#fImg").value=p&&p.img&&!/^data:/.test(p.img)?p.img:"";
    $("#formErr").textContent="";
    setPreview(p?p.img||"":"");
    $("#prev").style.setProperty("--c",$("#fColor").value);
    dlg.showModal();
  }
  $("#add").onclick=function(){openForm()};
  $("#cancel").onclick=function(){dlg.close()};
  $("#fColor").addEventListener("input",function(e){$("#prev").style.setProperty("--c",e.target.value)});
  $("#fImg").addEventListener("input",function(e){setPreview(e.target.value.trim())});
  $("#fFile").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    resize(f,900).then(function(d){setPreview(d);$("#fImg").value=""})
      .catch(function(){$("#formErr").textContent="مقدرتش أقرا الصورة دي. جرب صورة تانية."});
  });
  function resize(file,max){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var im=new Image();
        im.onload=function(){
          var k=Math.min(1,max/Math.max(im.width,im.height));
          var c=document.createElement("canvas");
          c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          res(c.toDataURL("image/jpeg",.82));
        };
        im.onerror=rej;im.src=fr.result;
      };
      fr.onerror=rej;fr.readAsDataURL(file);
    });
  }
  $("#form").addEventListener("submit",function(e){
    e.preventDefault();
    var title=$("#fTitle").value.trim(),demo=$("#fDemo").value.trim(),repo=$("#fRepo").value.trim();
    if(!title)return $("#formErr").textContent="اكتب اسم المشروع.";
    if(!okUrl(demo)||!okUrl(repo))return $("#formErr").textContent="الرابط لازم يبدأ بـ https://";
    var data={
      title:title,desc:$("#fDesc").value.trim(),
      tags:$("#fTags").value.split(",").map(function(t){return t.trim()}).filter(Boolean).slice(0,8),
      img:imgValue,demo:demo,repo:repo,color:$("#fColor").value
    };
    var before=clone(list);
    if(editing!==null)list[editing]=Object.assign({id:list[editing].id},data);
    else list.push(Object.assign({id:"p"+Date.now()},data));
    if(save()){dlg.close();toast(editing!==null?"اتحفظ التعديل":"اتضاف المشروع")}
    else list=before;
  });

  /* publish / backup / import / reset */
  function download(name,text,type){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:type}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  }
  $("#publish").onclick=function(){
    download("projects.js","/* Portfolio projects - generated by admin.html */\nwindow.SHNO_PROJECTS = "+JSON.stringify(list,null,2)+";\n","text/javascript");
    toast("نزل projects.js. حطه مكان القديم وارفع الموقع.");
  };
  $("#backup").onclick=function(){download("portfolio-backup.json",JSON.stringify(list,null,2),"application/json")};
  $("#importFile").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var arr=JSON.parse(fr.result);
        if(!Array.isArray(arr)||!arr.every(function(p){return p&&p.title}))throw 0;
        if(!confirm("هتستبدل المشاريع الحالية بـ "+arr.length+" مشروع. متأكد؟"))return;
        list=arr.map(function(p,i){return{id:p.id||"p"+Date.now()+i,title:String(p.title),desc:String(p.desc||""),tags:Array.isArray(p.tags)?p.tags.map(String):[],img:String(p.img||""),demo:String(p.demo||""),repo:String(p.repo||""),color:color(p.color)}});
        if(save())toast("اتعمل استيراد");
      }catch(err){toast("الملف ده مش نسخة احتياطية صحيحة.")}
      e.target.value="";
    };
    fr.readAsText(f);
  });
  $("#reset").onclick=function(){
    if(!confirm("هتلغي تعديلاتك وترجع للمشاريع الموجودة في projects.js. متأكد؟"))return;
    localStorage.removeItem(KEY);list=clone(published);render();toast("رجعنا للمنشور");
  };
})();
</script>
</body>
</html>
